# 사업 단계별 대표 질문 — ①화면의 예시 질문 버튼 ②답변 정확도 평가셋(전문가 검증)으로 함께 사용
착수·기초선조사:
  - "PDM 지표 중 기초선이나 목표치가 아직 정해지지 않은 지표는?"
  - "계약 체결 후 3개월 안에 제출해야 하는 산출물과 관리문서를 정리해줘"
  - "성과관리 전문가의 투입일수와 주요 업무는?"
일정:
  - "2027년에 제출해야 하는 보조산출물을 분기별로 정리해줘"
  - "정책 평가(활동 3.1.1)는 언제까지 끝내야 하고 어떤 산출물이 있어?"
월간 모니터링:
  - "지난달보다 이용자 수가 감소한 센터는?"
  - "앞으로 30일 안에 챙겨야 할 것은?"
반기·연차 보고:
  - "반기 보고서와 연차 보고서의 제출 기한과 포함해야 할 자료는?"
  - "지표 2.2-2의 연간 목표치와 산출 근거를 알려줘"
PSC·PIU 회의:
  - "PSC와 PIU는 얼마나 자주 열어야 하고 어떤 문서를 내야 해?"
  - "지난 회의 결정사항 중 미이행 건은?"
English:
  - "Which sub-outputs must be produced in both Korean and English for Output 3.1?"
